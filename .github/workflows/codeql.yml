name: CodeQL

# GitHub's static analysis for JavaScript: finds injection, unsafe URL handling, weak randomness and similar flaws
# in the site code and the Netlify functions. Results show up under Security > Code scanning on this public repo.
on:
  push:
    branches: [main, redesign/rails-nav-theme]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
