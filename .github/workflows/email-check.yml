name: Email check
# Checks hello@ forwarding and sends a test message. Runs when this file or tools/email-check.mjs changes,
# or by hand from the Actions tab once this workflow is on the default branch.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/email-check.yml", "Portfolio-astro/tools/email-check.mjs"]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Portfolio-astro } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/email-check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
