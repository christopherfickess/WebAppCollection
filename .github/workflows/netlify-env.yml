name: Sync secrets to Netlify

# Copies the repository secrets below into the Netlify site's environment
# variables, so the booking, payment and email functions can read them.
# Run it by hand (Actions tab > Sync secrets to Netlify > Run workflow).
# Netlify only applies new values to deploys built afterwards, so trigger a
# deploy once it finishes.
#
# Needed repository secrets (Settings > Secrets and variables > Actions):
#   NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID   (to reach the site)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY,
#   EMAIL_FROM, OWNER_EMAIL, STATS_TOKEN  (what the functions read)
# Any that are empty are skipped. Nothing is ever printed.
on:
  workflow_dispatch:
  # Also runs when this file changes on the dev branch, because GitHub only
  # offers the manual "Run workflow" button for workflows on the default branch.
  push:
    branches: [redesign/rails-nav-theme]
    paths: [".github/workflows/netlify-env.yml"]

jobs:
  sync:
    runs-on: ubuntu-latest
    # Add "environment: production" here later to require an approval first.
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set variables on Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are required."; exit 1
          fi
          # EMAIL_FROM and OWNER_EMAIL are addresses, not secrets, but are set
          # the same way so there is one place to manage them.
          npm install --global netlify-cli@27.16.2 > /dev/null 2>&1
          # Shows whether the site and token can be found (no secret values are printed).
          netlify api getSite --data "{\"site_id\":\"${NETLIFY_SITE_ID}\"}" > /tmp/site.json 2>/tmp/site.err || { echo "getSite failed:"; head -c 300 /tmp/site.err; }
          node -e 'try{const s=require("/tmp/site.json");console.log("site name:",s.name,"| has account_id:",!!s.account_id,"| account_slug:",s.account_slug,"| id matches:",s.id===process.env.NETLIFY_SITE_ID)}catch(e){console.log("no site data:",e.message)}'
          # env:set needs the site's account, which it reads from a linked site.
          netlify link --id "${NETLIFY_SITE_ID}" > /dev/null
          # Secret values must name their deploy contexts (not "dev").
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY EMAIL_FROM OWNER_EMAIL STATS_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then echo "skip $name (empty)"; continue; fi
            for ctx in production deploy-preview branch-deploy; do
              netlify env:set "$name" "$value" --secret --force --context "$ctx" > /dev/null
            done
            echo "set $name (production, deploy-preview, branch-deploy)"
          done
